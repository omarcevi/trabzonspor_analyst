[project]
name = "match-day-agents"
version = "1.0.0"
description = "DevFest Trabzon 2026 workshop: five agent patterns with Google ADK, on real Trabzonspor vs Gaziantep FK data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[mcp]>=2.13.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# matchday: the shared tools. steps: so step 5 can import the earlier teams.
packages = ["matchday", "steps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
